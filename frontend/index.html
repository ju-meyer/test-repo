<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoQuest MVP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>AlgoQuest: Sort & Search Academy</h1>
        <div class="stats">
          <span id="score">Score: 0</span>
          <span id="stars">Stars: 0</span>
          <span id="rank">Rank: Novice</span>
        </div>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>World Map</h2>
          <div id="worlds"></div>
          <hr />
          <h3>Levels</h3>
          <div id="levels"></div>
        </section>

        <section class="panel gameplay">
          <h2 id="level-title">Select a level</h2>
          <p id="level-concept" class="muted"></p>
          <p id="level-mission"></p>

          <div id="array-area" class="array-area"></div>
          <div id="prompt-area" class="prompt-area"></div>

          <div class="controls">
            <button id="run-btn">Run / Check</button>
            <button id="hint-btn">Hint</button>
            <button id="reset-btn">Reset</button>
            <button id="next-btn">Next Level</button>
          </div>

          <pre id="feedback" class="feedback">Load a level to begin.</pre>
        </section>
      </main>
    </div>

    <script src="/data/levels.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
